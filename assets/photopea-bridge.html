<!doctype html><html lang="ru"><meta charset="utf-8"><title>Photopea — сборка редактируемого PSD</title>
<style>body{margin:0;font:14px system-ui;background:#222;color:#fff}header{padding:10px}input{width:340px}input,button{padding:7px;margin:3px;font:inherit}iframe{border:0;width:100%;height:calc(100vh - 130px)}#status{white-space:pre-wrap;margin:6px;color:#ffdb79}</style>
<header><label>SVG относительно папки проекта <input id="path" value="fixture.svg"></label><button id="import" disabled>Импортировать SVG и сохранить PSD</button><button id="png" disabled>Сохранить PNG</button><button id="stats" disabled>Проверить текстовые слои</button><div id="status">Загрузка Photopea…</div></header>
<iframe id="pea" title="Photopea"></iframe>
<script>
const frame=document.querySelector('#pea'), status=document.querySelector('#status');
let pending=null,ready=false,name='design';
function log(text){status.textContent=text}
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.origin!=='https://www.photopea.com')return;
  if(event.data==='done'){
    if(pending){clearTimeout(pending.timer);const done=pending;pending=null;done.resolve(done.results)}
    else{ready=true;document.querySelector('#import').disabled=false;log('Photopea готов. Укажите подготовленный SVG; рядом должен быть .post.js.')}
  }else if(pending)pending.results.push(event.data);
});
function send(payload,timeout=300000){
  if(pending)return Promise.reject(new Error('Дождитесь текущей операции'));
  return new Promise((resolve,reject)=>{pending={resolve,reject,results:[],timer:setTimeout(()=>{pending=null;reject(new Error('Photopea не ответил done; проверьте редактор'))},timeout)};frame.contentWindow.postMessage(payload,'https://www.photopea.com')});
}
async function save(results,extension){
  const binary=results.filter(item=>item instanceof ArrayBuffer);
  if(!binary.length)throw new Error('Редактор не вернул бинарный файл: '+results.filter(x=>typeof x==='string').join('\n'));
  const response=await fetch('/__save/'+name+'.'+extension,{method:'POST',body:binary.at(-1)});
  if(!response.ok)throw new Error(await response.text());return await response.json();
}
function setBusy(value){for(const id of ['import','png','stats'])document.querySelector('#'+id).disabled=value||!ready||(id!=='import'&&!window.__hasDoc)}
document.querySelector('#import').onclick=async()=>{
  setBusy(true);
  try{
    const path=document.querySelector('#path').value.trim();
    if(!path.endsWith('.svg'))throw new Error('Укажите .svg');
    name=path.split('/').at(-1).slice(0,-4).replace(/[^A-Za-z0-9_.-]/g,'_')||'design';
    const [svg,post]=await Promise.all([fetch(path),fetch(path.slice(0,-4)+'.post.js')]);
    if(!svg.ok||!post.ok)throw new Error('SVG или post.js не найден в папке проекта');
    if(window.__hasDoc)await send('app.activeDocument.close(SaveOptions.DONOTSAVECHANGES);');
    log('Импорт SVG…');await send(await svg.arrayBuffer());window.__hasDoc=true;
    log('Восстановление имён, текста, интерлиньяжа и прозрачности…');const result=await send(await post.text());
    log(JSON.stringify(await save(result,'psd'))+'\nPSD сохранён. Сохраните PNG, проверьте слои и вид в редакторе.');
  }catch(error){log('Ошибка: '+error.message)}finally{setBusy(false)}
};
document.querySelector('#png').onclick=async()=>{setBusy(true);try{log(JSON.stringify(await save(await send("app.activeDocument.saveToOE('png');"),'png')))}catch(error){log(error.message)}finally{setBusy(false)}};
document.querySelector('#stats').onclick=async()=>{setBusy(true);try{const result=await send("var N=0;function c(ls){for(var i=0;i<ls.length;i++){var l=ls[i];if(l.kind==LayerKind.TEXT)N++;if(l.typename=='LayerSet')c(l.layers);}}c(app.activeDocument.layers);app.echoToOE('Editable text layers: '+N);");log(result.filter(x=>typeof x==='string').join('\n'))}catch(error){log(error.message)}finally{setBusy(false)}};
frame.src='https://www.photopea.com#'+encodeURIComponent(JSON.stringify({environment:{lang:'ru',theme:2,intro:false}}));
</script></html>
